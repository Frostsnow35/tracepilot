services:
  db:
    image: timescale/timescaledb:pg16-jammy
    container_name: tracepilot-db
    environment:
      POSTGRES_DB: tracepilot
      POSTGRES_USER: tracepilot
      POSTGRES_PASSWORD: tracepilot
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracepilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: tracepilot-backend
    environment:
      TRACEPILOT_DATABASE_URL: postgresql://tracepilot:tracepilot@db:5432/tracepilot
      TRACEPILOT_ENV: dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["tracepilot-api"]

volumes:
  dbdata:
